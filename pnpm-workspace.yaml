packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  # Sadece Trigger.dev Cloud'a uzak imaj derlemesi için; yerelde gerekmez.
  '@depot/cli': false
  esbuild: true
minimumReleaseAgeExclude:
  - '@aws-sdk/checksums@3.1002.0'
  - '@aws-sdk/client-s3@3.1160.0'
  - '@aws-sdk/core@3.979.0'
  - '@aws-sdk/credential-provider-env@3.972.79'
  - '@aws-sdk/credential-provider-http@3.972.81'
  - '@aws-sdk/credential-provider-ini@3.973.24'
  - '@aws-sdk/credential-provider-login@3.972.86'
  - '@aws-sdk/credential-provider-node@3.972.91'
  - '@aws-sdk/credential-provider-process@3.972.79'
  - '@aws-sdk/credential-provider-sso@3.973.23'
  - '@aws-sdk/credential-provider-web-identity@3.972.85'
  - '@aws-sdk/middleware-sdk-s3@3.972.84'
  - '@aws-sdk/nested-clients@3.997.53'
  - '@aws-sdk/token-providers@3.1160.0'
  - postgres@4.0.0
  - '@trigger.dev/build@4.8.3'
  - '@trigger.dev/core@4.8.3'
  - '@trigger.dev/schema-to-json@4.8.3'
  - '@trigger.dev/sdk@4.8.3'
  - trigger.dev@4.8.3
  - lucide-react@1.64.0
overrides:
  # Güvenlik: trigger.dev zincirindeki eski tar/zod (aynı büyük sürüm içinde yükseltme).
  tar@<7.5.22: 7.5.22
  zod@>=4 <4.6.6: 4.6.7
  # Güvenlik (Dependabot): Prisma config (trigger.dev) ve drizzle-kit zincirindeki geliştirme araçları; yamalı sürüm
  # üst sürümde, CLI'lar bu sürümlerle denendi.
  deepmerge-ts@<8.0.0: 8.0.2
  esbuild@<0.25.0: 0.25.12
  # Güvenlik (Dependabot): minimatch <11.0.1 glob parçalarıyla hizmet aksatma; 10.x yamalanmadı. Tek kullanan trigger.dev
  # 4.8.3 (en son sürüm, minimatch ^10 istiyor) ve 11'de kaldırılan makeRe'yi çağırıyor: patches/trigger.dev@4.8.3.patch
  # onu paket adı kalıbından düzenli ifadeyle değiştirir (yalnız * ** ? jokerleri).
  minimatch@<11.0.1: 11.0.4
  # Güvenlik (Dependabot): @hono/node-server <2.1.6 ters vekilde ters bölüyle yol denetimini aşma ve WebSocket yükseltmesinde
  # ECONNRESET ile çökme. MCP SDK (Agent SDK ve trigger.dev zinciri) 2.x istiyor; yamalı sürüm aynı küçük sürümde.
  '@hono/node-server@>=2.0.0 <2.1.6': 2.1.6
  # Aynı zincirde hono'nun kendisi: <4.13.16 csrf/validator/mount/RegExpRouter ara katman atlamaları ve css helper HTML
  # enjeksiyonu. MCP SDK ^4 istiyor; en son 4.x yamaya alındı.
  hono@<4.13.16: 4.13.18
patchedDependencies:
  trigger.dev@4.8.3: patches/trigger.dev@4.8.3.patch
