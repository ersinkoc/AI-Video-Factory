name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Types, coverage and Studio build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4; packageManager pins pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install media audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Record source and environment
        run: |
          mkdir -p out/ci
          {
            git rev-parse HEAD
            sha256sum pnpm-lock.yaml
            node --version
            pnpm --version
            ffmpeg -version
            ffprobe -version
          } | tee out/ci/environment.txt
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee out/ci/typecheck.log
      - name: Release ownership against disposable Git repositories
        run: pnpm exec vitest run --config vitest.release.config.ts 2>&1 | tee out/ci/release-ownership.log
      - name: Full tests and 100 percent coverage
        run: pnpm test:coverage 2>&1 | tee out/ci/coverage.log
      - name: Production Studio build
        run: pnpm studio:build 2>&1 | tee out/ci/studio-build.log
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ github.sha }}
          path: |
            out/ci/
            coverage/coverage-summary.json
          retention-days: 14

  media:
    name: No-generation render and export audits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      STORE: fs
      LEDGER: jsonl
      YS_RENDER_GL: swangle
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libnss3 libgbm1 libasound2t64
      - name: Record source and environment
        run: |
          mkdir -p out/ci/render
          {
            git rev-parse HEAD
            sha256sum pnpm-lock.yaml
            node --version
            pnpm --version
            ffmpeg -version
          } | tee out/ci/environment.txt
      - name: Render the existing offline demo in an isolated store
        working-directory: out/ci/render
        run: node ../../../node_modules/tsx/dist/cli.mjs ../../../apps/cli/src/index.ts render-demo 2>&1 | tee ../render.log
      - name: Approve the synthetic preview, finish rendering and audit the MP4
        working-directory: out/ci/render
        run: |
          shopt -s nullglob
          episodes=(.data/assets/episodes/*/)
          test "${#episodes[@]}" -eq 1
          episode=$(basename "${episodes[0]}")
          node ../../../node_modules/tsx/dist/cli.mjs ../../../apps/cli/src/index.ts episode approve "$episode" preview
          node ../../../node_modules/tsx/dist/cli.mjs ../../../apps/cli/src/index.ts episode run "$episode" --only render 2>&1 | tee ../render-resume.log
          node ../../../node_modules/tsx/dist/cli.mjs ../../../apps/cli/src/index.ts episode audit "$episode" 2>&1 | tee ../render-audit.log
          test -s ".data/episodes/$episode/$episode.mp4"
          test ! -s .data/ledger.jsonl
          find .data -type f \( -name '*.mp4' -o -name '*.json' \) -print0 | sort -z | xargs -0 sha256sum > ../media-sha256.txt
      - name: Verify main and Short decision isolation
        run: pnpm quality:preview out/ci/quality 2>&1 | tee out/ci/quality.log
      - name: Record offline environment diagnostics
        run: pnpm --silent ys doctor --json > out/ci/doctor.json
      - name: Retain media evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: media-${{ github.sha }}
          include-hidden-files: true
          path: |
            out/ci/*.txt
            out/ci/*.log
            out/ci/doctor.json
            out/ci/render/.data/episodes/*/*.mp4
            out/ci/render/.data/assets/episodes/**/*.json
            out/ci/quality/verification.json
            out/ci/quality/.data/episodes/**/*.mp4
            out/ci/quality/.data/assets/episodes/**/*.json
          retention-days: 7

  integration:
    name: PostgreSQL and RustFS integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ys
          POSTGRES_PASSWORD: ys
          POSTGRES_DB: youtube_studio
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ys -d youtube_studio"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rustfs:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: ysrustfs
          RUSTFS_SECRET_KEY: ysrustfs-secret
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: "false"
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgres://ys:ys@127.0.0.1:5433/youtube_studio
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: ys-ci-assets
      S3_ACCESS_KEY_ID: ysrustfs
      S3_SECRET_ACCESS_KEY: ysrustfs-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for S3 readiness
        run: curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 "$S3_ENDPOINT/health/ready" --output /dev/null
      - name: Migrate the disposable database
        run: pnpm db:migrate
      - name: Run integrations explicitly
        run: |
          mkdir -p out/ci
          git rev-parse HEAD > out/ci/source.txt
          pnpm test:integration 2>&1 | tee out/ci/integration.log
      - name: Retain integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-${{ github.sha }}
          path: out/ci/
          retention-days: 14
